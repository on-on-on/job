<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이번 주 채용 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --line:#dde2ea; --text:#142033; --muted:#5a6578;
  --accent:#1f3a68; --acc-soft:#e6ecf5; --oa:#0f5c5a; --oa-soft:#e2f1ee; --on-accent:#ffffff; --hl:#ffdf7e; --hl-band:#ffe28f; --hl-text:#2a1f00; --chip:#edf0f5;
  --urgent:#c0392b; --closed:#9aa3b2;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1824; --surface:#152132; --line:#243246; --text:#eef2f7; --muted:#9aa8bb;
    --accent:#9fbbec; --acc-soft:rgba(80,118,186,.28); --oa:#8fd8cc; --oa-soft:rgba(40,140,128,.28); --on-accent:#0f1824; --hl:#ffcf5a; --hl-band:rgba(255,207,90,.32); --hl-text:#1a1300; --chip:#1c2a3e;
    --urgent:#ff8a7a; --closed:#5d6a7e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1824; --surface:#152132; --line:#243246; --text:#eef2f7; --muted:#9aa8bb;
  --accent:#9fbbec; --acc-soft:rgba(80,118,186,.28); --oa:#8fd8cc; --oa-soft:rgba(40,140,128,.28); --on-accent:#0f1824; --hl:#ffcf5a; --hl-band:rgba(255,207,90,.32); --hl-text:#1a1300; --chip:#1c2a3e;
  --urgent:#ff8a7a; --closed:#5d6a7e;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sample{background:var(--hl);color:var(--hl-text);text-align:center;font-size:14px;padding:8px 16px;font-weight:500}

header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.3}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap}

.hero{padding:64px 0 36px}
.hero h1{font-size:clamp(36px,6.2vw,66px);line-height:1.18;letter-spacing:-.03em;margin:0 0 22px;font-weight:700}
.hero h1 .band{background:linear-gradient(transparent 58%,var(--hl-band) 58%,var(--hl-band) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);font-size:17px;max-width:34em;margin:0 0 30px}
.issue{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:15px;color:var(--muted)}
select,input[type=search]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px}
select{padding:8px 12px;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 48px}
.stat{padding:22px 24px 22px 0}
.stat+.stat{border-left:1px solid var(--line);padding-left:24px}
.stat b{display:block;font-size:36px;line-height:1.1;color:var(--accent);font-weight:700;margin-bottom:4px}
.stat span{font-size:14px;color:var(--muted)}
@media (max-width:640px){
  .stat{padding:16px 10px 16px 0}
  .stat+.stat{padding-left:12px}
  .stat b{font-size:28px}
  .stat span{font-size:13px;line-height:1.35;display:block}
  .hero{padding:44px 0 28px}
  .wrap{padding:0 18px}
}

.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.toolbar h2{margin:0;font-size:24px;letter-spacing:-.02em}
.count{font-size:14px;color:var(--muted);margin-left:8px;font-weight:500}
input[type=search]{width:min(320px,100%);padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{font:inherit;font-size:15px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0 0 24px;max-width:70em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card.is-closed{opacity:.55}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{font-size:13px;background:var(--chip);border-radius:6px;padding:3px 9px;color:var(--muted);font-weight:500}
.tag.acc{background:var(--acc-soft);color:var(--accent)}
.tag.oa{background:var(--oa-soft);color:var(--oa)}
.dday{font-weight:700;font-size:22px;line-height:1;white-space:nowrap}
.dday.urgent{color:var(--urgent)}
.dday.closed{color:var(--closed);font-size:15px}
.dday.always{font-size:15px;color:var(--muted);font-weight:500}
.card h3{margin:0;font-size:18px;line-height:1.4;letter-spacing:-.01em}
.company{font-size:15px;color:var(--muted);margin-top:-8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
dt{color:var(--muted)} dd{margin:0}
.certs{display:flex;flex-wrap:wrap;gap:6px}
.cert{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.cert.ours{background:var(--hl);border-color:var(--hl);color:var(--hl-text);font-weight:500}
.cert.req{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.card a{margin-top:auto;padding-top:4px;font-size:15px;color:var(--accent);font-weight:500;text-decoration:none}
.card a:hover{text-decoration:underline}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

footer{border-top:1px solid var(--line);padding:28px 0 44px;font-size:13px;color:var(--muted)}
footer p{margin:0 0 6px;max-width:70em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">온코딩컴퓨터학원<small>수강생 채용 브리핑</small></div>
  </header>

  <section class="hero">
    <h1>이번 주 채용,<br><span class="band">배운 만큼 지원할 차례.</span></h1>
    <p>고용24에 올라온 공고 중 수강생에게 맞는 조건의 일자리를 골라 전합니다. 지원 전에는 꼭 원문을 확인하세요.</p>
    <div class="issue">
      <label for="week">발행일</label>
      <select id="week"></select>
    </div>
  </section>

  <section class="stats" aria-label="이번 주 요약">
    <div class="stat"><b id="sTotal">—</b><span>이번 주 공고</span></div>
    <div class="stat"><b id="sSoon">—</b><span>7일 안에 마감</span></div>
    <div class="stat"><b id="sOurs">—</b><span>자격증 우대 공고</span></div>
  </section>

  <section>
    <div class="toolbar">
      <h2>이번 주 공고<span class="count" id="count"></span></h2>
      <input type="search" id="q" placeholder="회사명·직무 검색" aria-label="회사명이나 직무로 검색">
    </div>
    <div class="chips" id="chips" role="group" aria-label="직무 분류"></div>
    <p class="note">고용24 전체 공고가 아니라 학원이 조건에 맞춰 고른 목록입니다. 급여·마감일 등은 수집 시점 기준이며, 이후 변경될 수 있습니다.</p>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <p>공고 원문과 권리는 각 채용 기업과 고용24에 있습니다. 지원 방법과 최신 내용은 원문에서 확인하세요.</p>
  </footer>
</div>

<script>
/* 공고 데이터는 briefings.json 파일에서 불러옵니다 */
let BRIEFINGS = {};

const CATS = ["전체","회계·세무","사무"];
const OURS = ["컴활","ITQ","전산회계","전산세무","GTQ","CAT","COS"];
const SOURCE_URL = "https://www.work24.go.kr";
const state = {week:null, cat:"전체", q:""};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isOurs = c => OURS.some(k => c.includes(k));

function daysLeft(d){
  if(!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const e = new Date(d + "T00:00:00");
  return Math.round((e - t) / 86400000);
}
function ddayHTML(d){
  const n = daysLeft(d);
  if(n === null) return '<span class="dday always">상시 채용</span>';
  if(n < 0) return '<span class="dday closed">마감</span>';
  if(n === 0) return '<span class="dday urgent">D-DAY</span>';
  return `<span class="dday${n <= 3 ? " urgent" : ""}">D-${n}</span>`;
}
function fmtDate(d){
  const [y,m,day] = d.split("-").map(Number);
  return `${m}. ${day}.`;
}

function init(){
  const weeks = Object.keys(BRIEFINGS).sort().reverse();
  $("week").innerHTML = weeks.map(w => `<option value="${w}">${w}</option>`).join("");
  const fromHash = location.hash.slice(1);
  state.week = weeks.includes(fromHash) ? fromHash : weeks[0];
  $("week").value = state.week;

  $("chips").innerHTML = CATS.map(c => `<button type="button" data-cat="${c}" aria-pressed="${c === state.cat}">${c}</button>`).join("");
  $("chips").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    state.cat = b.dataset.cat;
    [...$("chips").children].forEach(x => x.setAttribute("aria-pressed", x === b));
    renderList();
  });
  $("week").addEventListener("change", e => {
    state.week = e.target.value;
    try{ history.replaceState(null, "", "#" + state.week); }catch(_){}
    render();
  });
  $("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if(BRIEFINGS[h]){ state.week = h; $("week").value = h; render(); }
  });
  render();
}

function render(){
  const b = BRIEFINGS[state.week];
  const jobs = b.jobs;
  $("sTotal").textContent = jobs.length;
  $("sSoon").textContent = jobs.filter(j => { const n = daysLeft(j.deadline); return n !== null && n >= 0 && n <= 7; }).length;
  $("sOurs").textContent = jobs.filter(j => j.certs.length > 0).length;
  renderList();
}

function renderList(){
  const q = state.q.toLowerCase();
  const list = BRIEFINGS[state.week].jobs.filter(j =>
    (state.cat === "전체" || j.cat === state.cat) &&
    (!q || (j.title + j.company + j.cat).toLowerCase().includes(q))
  );
  $("count").textContent = `${list.length}건`;
  if(!list.length){
    $("grid").innerHTML = '<div class="empty">조건에 맞는 공고가 없습니다. 분류를 ‘전체’로 바꾸거나 검색어를 지워 보세요.</div>';
    return;
  }
  $("grid").innerHTML = list.map(j => {
    const n = daysLeft(j.deadline);
    const closed = n !== null && n < 0;
    return `
    <article class="card${closed ? " is-closed" : ""}">
      <div class="card-top"><span class="tag ${j.cat === "사무" ? "oa" : "acc"}">${esc(j.cat)}</span>${ddayHTML(j.deadline)}</div>
      <h3>${esc(j.title)}</h3>
      <div class="company">${esc(j.company)}</div>
      <dl>
        <dt>근무지</dt><dd>${esc(j.loc)}</dd>
        <dt>급여</dt><dd>${esc(j.pay)}</dd>
        <dt>형태</dt><dd>${esc(j.type)}</dd>
        <dt>조건</dt><dd>${esc(j.cond)}</dd>
        <dt>마감</dt><dd>${j.deadline ? fmtDate(j.deadline) : "채용 시 마감"}</dd>
      </dl>
      <div class="certs">${(j.required || []).map(c => `<span class="cert req">필수 · ${esc(c)}</span>`).join("")}${j.certs.map(c => `<span class="cert">우대 · ${esc(c)}</span>`).join("")}</div>
      <a href="${esc(j.url || SOURCE_URL)}" target="_blank" rel="noopener">고용24에서 원문 보기 ↗</a>
    </article>`;
  }).join("");
}

fetch("briefings.json?v=" + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    BRIEFINGS = data;
    if(!Object.keys(BRIEFINGS).length) throw new Error("empty");
    init();
  })
  .catch(() => {
    $("grid").innerHTML = '<div class="empty">공고를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>';
  });
</script>
</body>
</html>
